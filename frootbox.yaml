title: 'Basis'
description: 'Basis-Theme: Tokens und Bausteine, auf denen Themes aufbauen'
theme:
  tokens:
    color:
      bg: '#ffffff'
      surface: '#f5f5f4'
      text: '#1c1917'
      muted: '#57534e'
      primary: '#1d4ed8'
      primary-contrast: '#ffffff'
      accent: '#f59e0b'
      dark: '#1c1917'
      line: '#e7e5e4'
    font:
      body: 'system-ui, -apple-system, "Segoe UI", sans-serif'
      heading: 'system-ui, -apple-system, "Segoe UI", sans-serif'
    radius: 8px
    space: 'clamp(3rem, 8vw, 6rem)'
    width: 72rem
