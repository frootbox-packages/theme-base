title: Section
description: Columns with headings, texts, images, buttons and smaller blocks such as quotes, notices or key figures. On narrow screens the columns stand one below the other.
group: structure
keywords: [Columns, Grid]
areas:
  first: { label: First column, allow: [Heading, Text, Image, Button, TextWithHeading, Quote, Notice, Divider, CallToAction, KeyFigures, ImageWithText, Gallery, Slider, Video, VideoEmbed, Map, Cards, Logos, LinkList, Accordion, Steps, Testimonials, Pricing, Contact, Features, Downloads, Table] }
