title: Hero
description: The big opening at the top of a page with a heading, a sentence and up to two buttons, mostly on the start page or a landing page. Without an image, with the image beside the text, or with the image behind it. Once per page, as the first block; not for teasers further down, use image with text for that.
group: header
keywords: [Header, Intro, Banner, Stage, Opening, Teaser]
fields:
  eyebrow: { type: headline, label: Eyebrow, optional: true, maxLength: 60, placeholder: "A few words above the heading" }
  title: { type: headline, label: Heading, maxLength: 100, placeholder: "What the website offers" }
  text: { type: text, label: Text, optional: true, multiline: true, maxLength: 300, placeholder: "One or two sentences that say more" }
  primary: { type: link, label: Button, optional: true }
  secondary: { type: link, label: Second button, optional: true }
  # The first image of the page: it loads at once (decision 0173).
  image: { type: image, label: Image, description: "Only in the variants with an image", optional: true, eager: true, sizes: "100vw" }
# Content for the design page (decision 0206).
examples:
  - variant: Default
    fields:
      eyebrow: 'Roastery by the harbour'
      title: 'Coffee, freshly roasted in Hamburg'
      text: 'We roast in small batches and send your coffee out the day after.'
      primary: { url: 'https://example.org/', text: 'To the shop' }
      secondary: { url: 'https://example.org/', text: 'About us' }
  - variant: Default
    options: { background: primary }
    fields:
      eyebrow: 'Roastery by the harbour'
      title: 'Coffee, freshly roasted in Hamburg'
      text: 'We roast in small batches and send your coffee out the day after.'
      primary: { url: 'https://example.org/', text: 'To the shop' }
      secondary: { url: 'https://example.org/', text: 'About us' }
  - variant: Default
