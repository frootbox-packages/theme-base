"A short note that stands out from the text, as information, warning or success, e.g. changed opening hours. Not for longer texts or for advertising, use a call to action for that.": "Ein kurzer Hinweis, der sich vom Text abhebt, als Information, Warnung oder Erfolg, z. B. geänderte Öffnungszeiten. Nicht für längere Texte oder Werbung, dafür gibt es den Aufruf."
"A single statement set large, with who said it. For several voices of customers use the block for testimonials.": "Eine einzelne Aussage, groß gesetzt, mit Angabe, wer sie gemacht hat. Für mehrere Stimmen von Kunden gibt es den Block Kundenstimmen."
