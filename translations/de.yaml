"Several teasers side by side, each with an image, a heading, a short text and a link, e.g. offers, rooms or articles. At most the chosen number of columns, fewer where there is less room. For a single teaser use image with text.": "Mehrere Teaser nebeneinander, je mit Bild, Überschrift, kurzem Text und Link, z. B. Angebote, Zimmer oder Artikel. Höchstens so viele Spalten wie gewählt, weniger, wo weniger Platz ist. Für einen einzelnen Teaser gibt es Bild mit Text."
