"The big opening at the top of a page with a heading, a sentence and up to two buttons, mostly on the start page or a landing page. Without an image, with the image beside the text, or with the image behind it. Once per page, as the first block; not for teasers further down, use image with text for that.": "Der große Einstieg oben auf einer Seite mit Überschrift, einem Satz und bis zu zwei Buttons, meist auf der Startseite oder einer Landingpage. Ohne Bild, mit Bild neben dem Text oder mit Bild dahinter. Einmal je Seite, als erster Block; nicht für Teaser weiter unten, dafür gibt es Bild mit Text."
