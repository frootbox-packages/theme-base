"The big opening at the top of a page with a heading, a sentence and up to two buttons, mostly on the start page or a landing page. Centred without an image, with the image beside the text, or with the image behind it. Once per page, as the first block; not for teasers further down, use image with text for that.": "Der große Einstieg oben auf einer Seite mit Überschrift, einem Satz und bis zu zwei Buttons, meist auf der Startseite oder einer Landingpage. Zentriert ohne Bild, mit Bild neben dem Text oder mit Bild dahinter. Einmal je Seite, als erster Block; nicht für Teaser weiter unten, dafür gibt es Bild mit Text."
"The image after the text, on the right in left-to-right languages.": "Das Bild nach dem Text, in Sprachen von links nach rechts also rechts."
"The image before the text, on the left in left-to-right languages.": "Das Bild vor dem Text, in Sprachen von links nach rechts also links."
"The image fills the area, the text stands on a dark layer above it, so it stays readable on any image.": "Das Bild füllt die Fläche, der Text steht auf einer dunklen Schicht darüber und bleibt auf jedem Bild lesbar."
"The text on one side, the image on the other. On narrow screens the image stands above the text.": "Der Text auf der einen Seite, das Bild auf der anderen. Auf schmalen Bildschirmen steht das Bild über dem Text."
