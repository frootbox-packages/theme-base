# German texts for the labels of the theme (decision 0161).
"A coloured band with a heading, a sentence and a button, e.g. to invite people to book or get in touch, mostly at the end of a page. In a column it becomes a box. Use it once or twice a page, not for plain links.": "Ein farbiges Band mit Überschrift, einem Satz und einem Button, z. B. um zum Buchen oder Melden einzuladen, meist am Ende einer Seite. In einer Spalte wird es ein Kasten. Ein- oder zweimal je Seite, nicht für einfache Links."
"A few sentences that lead into the page": "Ein paar Sätze, die in die Seite einführen"
"A heading in a column. Its level follows from where it stands. Not for the title of the page, that comes from the layout; for a heading with text in the main area use text with heading.": "Eine Überschrift in einer Spalte. Ihre Ebene ergibt sich aus der Stelle, an der sie steht. Nicht für den Titel der Seite, der kommt aus dem Layout; für eine Überschrift mit Text im Hauptbereich gibt es Text mit Überschrift."
"A heading with formatted text below, for the running text of a page. Narrow keeps lines short and easy to read; wide uses the width of the content. Not for short teasers next to each other, use a section with columns for that.": "Eine Überschrift mit formatiertem Text darunter, für den Fließtext einer Seite. Schmal hält die Zeilen kurz und gut lesbar, breit nutzt die Breite des Inhalts. Nicht für kurze Teaser nebeneinander, dafür gibt es den Abschnitt mit Spalten."
"A line or some room between two blocks, e.g. to end a topic. Not to push content into place.": "Eine Linie oder etwas Abstand zwischen zwei Blöcken, z. B. am Ende eines Themas. Nicht, um Inhalte zurechtzurücken."
"A link as a button in a column, for the next step a visitor should take. Not for lists of links; at most two buttons next to each other.": "Ein Link als Button in einer Spalte, für den nächsten Schritt eines Besuchers. Nicht für Listen von Links; höchstens zwei Buttons nebeneinander."
"A look inside": "Ein Blick hinein"
"A narrow column on the left, a wide one on the right.": "Schmale Spalte links, breite rechts."
"A page for a campaign without the main navigation, so nothing leads away. The footer keeps its links, e.g. to the legal notice.": "Eine Seite für eine Kampagne ohne Hauptnavigation, damit nichts wegführt. Der Fuß behält seine Links, etwa zum Impressum."
"A page with breadcrumbs, heading, introduction and content.": "Eine Seite mit Brotkrumen, Überschrift, Einleitung und Inhalt."
"A sentence that tells why it is worth it": "Ein Satz, warum es sich lohnt"
"A short note that stands out from the text, as information, warning or success, e.g. changed opening hours. Not for longer texts or for advertising, use a call to action for that.": "Ein kurzer Hinweis, der sich vom Text abhebt, als Information, Warnung oder Erfolg, z. B. geänderte Öffnungszeiten. Nicht für längere Texte oder Werbung, dafür gibt es den Aufruf."
"A single statement set large, with who said it. For several voices of customers use the block for testimonials.": "Eine einzelne Aussage, groß gesetzt, mit Angabe, wer sie gemacht hat. Für mehrere Stimmen von Kunden gibt es den Block Kundenstimmen."
"A start page only with content, e.g. sections one below the other; the main navigation leads to the subpages.": "Eine Startseite nur mit Inhalt, etwa Abschnitten untereinander. Die Hauptnavigation führt zu den Unterseiten."
"A wide column on the left, a narrow one on the right.": "Breite Spalte links, schmale rechts."
"Accent": "Akzent"
"Across the width of the content, for short texts.": "Über die Breite des Inhalts, für kurze Texte."
"Address in the footer": "Adresse im Fuß"
"Alert": "Meldung"
"An image beside a heading, text and an optional link, e.g. to present an offer or a place. Several in a row can alternate the side of the image. On narrow room the image stands above the text. Not for the opening of a page, use the hero for that.": "Ein Bild neben Überschrift, Text und einem Link nach Wahl, z. B. um ein Angebot oder einen Ort vorzustellen. Mehrere hintereinander können die Seite des Bildes wechseln. Bei wenig Platz steht das Bild über dem Text. Nicht für den Einstieg einer Seite, dafür gibt es den Hero."
"An image from the media in a column, with a caption if you like. Every image needs a description of what it shows. Not for pure decoration.": "Ein Bild aus den Medien in einer Spalte, auf Wunsch mit Bildunterschrift. Jedes Bild braucht eine Beschreibung dessen, was es zeigt. Nicht als reine Dekoration."
