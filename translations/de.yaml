"Several images in an even grid, e.g. impressions of a place or an event. A click shows an image large, with the others to browse. Not for a single image, use the image widget; to show images one after the other in a row use the image slider.": "Mehrere Bilder in einem gleichmäßigen Raster, z. B. Eindrücke von einem Ort oder einer Veranstaltung. Ein Klick zeigt ein Bild groß, die anderen lassen sich durchblättern. Nicht für ein einzelnes Bild, dafür gibt es das Widget Bild; für Bilder nacheinander in einer Reihe gibt es den Bildslider."
"Several teasers side by side, each with an image, a heading, a short text and a link, e.g. offers, rooms or articles. At most the chosen number of columns, fewer where there is less room. For a single teaser use image with text.": "Mehrere Teaser nebeneinander, je mit Bild, Überschrift, kurzem Text und Link, z. B. Angebote, Zimmer oder Artikel. Höchstens so viele Spalten wie gewählt, weniger, wo weniger Platz ist. Für einen einzelnen Teaser gibt es Bild mit Text."
"Several voices of customers or guests side by side, each with name and, if you like, role and photo. Only real statements, with consent. For a single statement use the quote.": "Mehrere Stimmen von Kunden oder Gästen nebeneinander, je mit Name und auf Wunsch Rolle und Foto. Nur echte Aussagen, mit Einverständnis. Für eine einzelne Aussage gibt es das Zitat."
