# A sample website of the base theme, for
#
#     php bin/frootbox seed frootbox/theme-base:demo/library.yaml
#
# Each subpage shows one block at the three places of decision 0163: in
# the main area, in one of two columns and in a narrow column of a third.
# The browser tests take screenshots of them and check them with axe.
# Needs the language de. The images in media/ are abstract colour
# gradients made for this file, the clip roasting.webm comes from
# tools/demo-video.php, the price list and the table of coffees are
# made for this file as well; all under the licence of the theme.
- upload:
    file: media/harbour.jpg
  as: file_harbour
- media.create:
    upload: '${file_harbour.token}'
    texts:
      de:
        alt: 'Orangefarbener Lichtkreis auf tiefblauem Grund'
  as: img_harbour
- upload:
    file: media/roastery.jpg
  as: file_roastery
- media.create:
    upload: '${file_roastery.token}'
    texts:
      de:
        alt: 'Goldenes Licht auf dunklem Rotbraun'
  as: img_roastery
- upload:
    file: media/beans.jpg
  as: file_beans
- media.create:
    upload: '${file_beans.token}'
    texts:
      de:
        alt: 'Warmer Verlauf von Braun zu Creme'
  as: img_beans
- upload:
    file: media/tasting.jpg
  as: file_tasting
- media.create:
    upload: '${file_tasting.token}'
    texts:
      de:
        alt: 'Blauer Kreis auf grünem Verlauf'
  as: img_tasting
- upload:
    file: media/roasting.webm
  as: file_roasting
- media.create:
    upload: '${file_roasting.token}'
    texts:
      de:
        alt: 'Film: Lichtkreise ziehen über dunkles Braun'
  as: vid_roasting
- upload:
    file: media/roasting.jpg
  as: file_roasting_poster
- media.create:
    upload: '${file_roasting_poster.token}'
  as: img_roasting
- upload:
    file: media/portrait.jpg
  as: file_portrait
- media.create:
    upload: '${file_portrait.token}'
    texts:
      de:
        alt: 'Gelbes Licht auf Pink und Violett, hochkant'
  as: img_portrait
- upload:
    file: media/square.jpg
  as: file_square
- media.create:
    upload: '${file_square.token}'
    texts:
      de:
        alt: 'Orangefarbener Kreis auf Türkis'
  as: img_square
- upload:
    file: media/price-list.pdf
  as: file_price_list
- media.create:
    upload: '${file_price_list.token}'
    texts:
      de:
        title: 'Preisliste 2027'
  as: doc_price_list
- upload:
    file: media/coffees.csv
  as: file_coffees
- media.create:
    upload: '${file_coffees.token}'
  as: doc_coffees
- page.create:
