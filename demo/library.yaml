              - { block: frootbox/theme-base/KeyFigures, fields: { title: 'Bohnenglück in Zahlen', items: [{ value: '12', label: 'Jahre Röstererfahrung' }, { value: '4.800', label: 'Kunden im letzten Jahr' }, { value: '9', label: 'Sorten im Regal' }] } }
