          areas:
            main:
              - { block: frootbox/theme-base/Hero, variant: Background, options: { height: medium }, fields: { title: 'Die Bibliothek des Basis-Themes', text: 'Jede Unterseite zeigt einen Block an drei Stellen: über die ganze Breite, in einer von zwei Spalten und in einer schmalen Spalte.', primary: { url: /heading, text: 'Zur Überschrift' }, image: { media: '${img_harbour.id}' } } }
